[package]
name = "raizledger"
version = "0.1.0"
description = "RaízLedger: registro on-chain del cuidado de plantas en Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "raizledger"

[features]
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.32.0"

[dev-dependencies]
litesvm = "0.7.0"
solana-sdk = "2.3"
